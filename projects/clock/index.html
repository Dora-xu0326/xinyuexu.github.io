
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clock project</title>

  <link rel="stylesheet" href="main.css">

  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>

<body>

  <div class="clock">

    <img class="background" src="img/background.jpg" alt="Autumn background">

    <h1>
      <span class="found">FOUND</span>
      <span class="time">TIME</span>
    </h1>

    <div class="numbers">

      <div class="number-group">
        <img class="hour1" src="img/1.jpg">
        <img class="hour2" src="img/4.jpg">
      </div>

      <div class="number-group">
        <img class="minute1" src="img/3.jpg">
        <img class="minute2" src="img/5.jpg">
      </div>

    </div>

    <div class="seconds">
      <div class="line"></div>
      <img class="leaf" src="img/leaf.png" alt="Maple leaf">
    </div>

  </div>

  <script src="main.js"></script>

</body>
</html>
